name: Main Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to test (e.g. v0.1.0-alpha)"
        required: true
        default: "v0.1.0-alpha"
        type: string
      dry_run:
        description: "Dry run (skip GitHub Release and Nexus Mods upload)"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  make-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.changelog.outputs.tag }}
      clean_version: ${{ steps.changelog.outputs.clean_version }}
      is_prerelease: ${{ steps.changelog.outputs.is_prerelease }}
      changelog_text: ${{ steps.changelog.outputs.changelog_text }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract changelog and version metadata
        id: changelog
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          python3 - <<'PY'
          import os, re, uuid

          tag = (os.environ.get("INPUT_TAG") or os.environ["GITHUB_REF_NAME"]).strip()
          clean_version = tag[1:] if tag.startswith("v") else tag
          low_tag = tag.lower()
          is_prerelease = "true" if any(k in low_tag for k in ("alpha", "beta", "rc", "pre")) else "false"

          section = ""
          if os.path.exists("CHANGELOG.md"):
              with open("CHANGELOG.md", "r", encoding="utf-8") as f:
                  text = f.read()
              candidates = {tag, clean_version, f"v{clean_version}"}
              lines = text.splitlines()
              capturing = False
              buf = []
              for line in lines:
                  m = re.match(r"^##\s+(.+?)\s*$", line)
                  if m:
                      if capturing:
                          break
                      header = m.group(1).strip()
                      if header in candidates or any(header.startswith(f"{c} ") or header.startswith(f"{c}-") for c in candidates):
                          capturing = True
                          continue
                  elif capturing:
                      buf.append(line)
              while buf and (not buf[0].strip() or buf[0].strip() == "---"):
                  buf.pop(0)
              while buf and (not buf[-1].strip() or buf[-1].strip() == "---"):
                  buf.pop()
              section = "\n".join(buf)

          if not section:
              section = f"Automated release for {tag}"

          def strip_inline(s: str) -> str:
              s = re.sub(r"\[([^\]]+)\]\([^)]+\)", r"\1", s)
              s = re.sub(r"\*\*(.+?)\*\*", r"\1", s)
              s = re.sub(r"(?<!\*)\*([^*]+?)\*(?!\*)", r"\1", s)
              s = re.sub(r"`([^`]+?)`", r"\1", s)
              return s

          def md_to_plain(md: str) -> str:
              out = []
              for line in md.splitlines():
                  s = line.strip()
                  if s.startswith("### "):
                      out.append(f"{strip_inline(s[4:])}:")
                  elif s.startswith("#### "):
                      out.append(f"{strip_inline(s[5:])}:")
                  else:
                      out.append(strip_inline(line))
              return "\n".join(out).strip()

          plain_text = md_to_plain(section)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out_f:
              out_f.write(f"tag={tag}\n")
              out_f.write(f"clean_version={clean_version}\n")
              out_f.write(f"is_prerelease={is_prerelease}\n")
              for key, val in [("changelog_md", section), ("changelog_text", plain_text)]:
                  delim = f"EOF_{uuid.uuid4().hex}"
                  out_f.write(f"{key}<<{delim}\n{val}\n{delim}\n")
          PY

      - name: Create selective zip
        env:
          TAG: ${{ steps.changelog.outputs.tag }}
          CLEAN_VERSION: ${{ steps.changelog.outputs.clean_version }}
        run: |
          mkdir -p out
          printf '%s\n' "${CLEAN_VERSION}" > SKSE/Plugins/MORWHA/version.txt

          zip -r "out/MORWHA_${TAG}.zip" \
            Scripts/ \
            SKSE/ \
            -x ".github/*" \
            -x "*.pdb" \
            -x "*.mrst" \
            -x "*/.gitkeep" \
            -x "SKSE/Plugins/MORWHA/SkinStencils/*" \
            -x "SKSE/Plugins/MORWHA/MORWHA.ini" \
            -x "SKSE/Plugins/MORWHA/DynamicNPCRegistry.json*" \
            -x "SKSE/Plugins/MORWHA/GeneratedSkinCache.json*"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-zip
          path: out/MORWHA_${{ steps.changelog.outputs.tag }}.zip

      - name: Clean up existing releases or orphan drafts for tag
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.changelog.outputs.tag }}
        run: |
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases" > /tmp/releases.json
          python3 - <<'PY'
          import json, os, subprocess

          tag = os.environ["TAG"]
          repo = os.environ["GITHUB_REPOSITORY"]
          with open("/tmp/releases.json", "r", encoding="utf-8") as f:
              pages = json.load(f)

          for page in pages:
              for rel in page:
                  if rel.get("tag_name") == tag or rel.get("name") == tag:
                      rid = rel["id"]
                      print(f"Deleting existing/draft release {rid} (draft={rel.get('draft')}) for {tag}...")
                      subprocess.run(["gh", "api", "-X", "DELETE", f"repos/{repo}/releases/{rid}"], check=True)
          PY

      - name: Create GitHub Release
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.changelog.outputs.tag }}
          name: ${{ steps.changelog.outputs.tag }}
          prerelease: ${{ steps.changelog.outputs.is_prerelease == 'true' }}
          body: ${{ steps.changelog.outputs.changelog_md }}
          files: |
            out/MORWHA_${{ steps.changelog.outputs.tag }}.zip

  publish-nexus:
    name: Publish to Nexus Mods
    needs: make-release
    runs-on: ubuntu-latest
    environment: nexusmods
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: release-zip
          path: out

      - name: Rename artifact
        run: |
          TAG="${{ needs.make-release.outputs.tag }}"
          CLEAN_VERSION="${{ needs.make-release.outputs.clean_version }}"
          if [ "${TAG}" != "${CLEAN_VERSION}" ]; then
            mv "out/MORWHA_${TAG}.zip" "out/MORWHA_${CLEAN_VERSION}.zip"
          fi

      - name: Check Nexus Mods configuration
        id: nexus_gate
        env:
          NEXUS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
          NEXUS_MOD_ID: ${{ vars.NEXUSMODS_MOD_ID || secrets.NEXUSMODS_MOD_ID }}
          NEXUS_FILE_ID: ${{ vars.NEXUSMODS_FILE_ID || secrets.NEXUSMODS_FILE_ID }}
        run: |
          if [ -n "${NEXUS_API_KEY}" ] && [ -n "${NEXUS_MOD_ID}" ] && [ -n "${NEXUS_FILE_ID}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Nexus Mods credentials/IDs are not configured yet; skipping Nexus upload."
          fi

      - name: Dry run (Nexus Mods)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        env:
          DRY_FILENAME: out/MORWHA_${{ needs.make-release.outputs.clean_version }}.zip
          DRY_VERSION: ${{ needs.make-release.outputs.clean_version }}
          DRY_DISPLAY_NAME: M.O.R.W.H.A ${{ needs.make-release.outputs.clean_version }}
          DRY_CHANGELOG: ${{ needs.make-release.outputs.changelog_text }}
        run: |
          echo "=== DRY RUN: Nexus Mods upload skipped ==="
          ls -lh "${DRY_FILENAME}"
          echo "version: ${DRY_VERSION}"
          echo "display_name: ${DRY_DISPLAY_NAME}"
          echo "--- description & changelog ---"
          printf '%s\n' "${DRY_CHANGELOG}"

      - name: Upload to Nexus Mods
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && steps.nexus_gate.outputs.ready == 'true' }}
        uses: Nexus-Mods/upload-action@v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          mod_id: ${{ vars.NEXUSMODS_MOD_ID || secrets.NEXUSMODS_MOD_ID }}
          file_id: ${{ vars.NEXUSMODS_FILE_ID || secrets.NEXUSMODS_FILE_ID }}
          filename: out/MORWHA_${{ needs.make-release.outputs.clean_version }}.zip
          version: ${{ needs.make-release.outputs.clean_version }}
          display_name: M.O.R.W.H.A
          changelog: ${{ needs.make-release.outputs.changelog_text }}
          category: main
          update_mod_version: true
          primary_mod_manager_download: true
          archive_existing_version: false
